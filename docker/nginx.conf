server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Entry point: never cache — it changes on every deploy and has no hash
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Static assets (fonts, images, icons) are fine with long caching
    location ~* \.(?:css|mjs|map|ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

