server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS so upstream hostnames are re-resolved on
    # each request rather than cached at startup (prevents stale IP after
    # a container is recreated).
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    set $upstream_api http://festify-api:8089;
    set $upstream_fe  http://festify:80;

    location /api/ {
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass $upstream_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
