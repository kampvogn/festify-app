# Host-level nginx vhost for festify.kampvogn.dk
# Deploy: sudo cp docker/host-nginx-festify.kampvogn.dk.conf /etc/nginx/sites-enabled/festify.kampvogn.dk.conf
#         sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones — defined here in http context (file is included inside http {})
# Uses real client IP restored from Cloudflare header below.
limit_req_zone $binary_remote_addr zone=festify_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=festify_api:10m  rate=60r/m;

# Cloudflare-origin check. IMPORTANT: allow/deny cannot be used together with
# real_ip here — real_ip rewrites $remote_addr to the visitor's IP *before*
# the access module runs, so an allow-list of Cloudflare ranges would 403
# every request. Instead we test $realip_remote_addr (the original peer
# address, preserved by the realip module) via this geo map.
geo $realip_remote_addr $festify_from_cloudflare {
    default 0;
    # Cloudflare IPv4
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    108.162.192.0/18 1;
    131.0.72.0/22    1;
    141.101.64.0/18  1;
    162.158.0.0/15   1;
    172.64.0.0/13    1;
    173.245.48.0/20  1;
    188.114.96.0/20  1;
    190.93.240.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    # Cloudflare IPv6
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
    # Localhost
    127.0.0.1        1;
    ::1              1;
}

server {
    listen 80;
    listen [::]:80;
    server_name festify.kampvogn.dk;

    # Only accept traffic from Cloudflare (no real_ip on this block, so the
    # classic allowlist still works against the raw peer address).
    include /etc/nginx/cloudflare-allowlist.conf;

    return 301 https://$host$request_uri;
}

server {
    listen 443;
    listen [::]:443;
    server_name festify.kampvogn.dk;

    ssl_certificate     /etc/ssl/kampvogn/festify.kampvogn.dk.crt;
    ssl_certificate_key /etc/ssl/kampvogn/festify.kampvogn.dk.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/festify.kampvogn.dk.access.log;
    error_log  /var/log/nginx/festify.kampvogn.dk.error.log;

    # Restore real client IP from Cloudflare so rate limiting targets
    # individual users, not the Cloudflare IP range.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Only accept traffic that arrived via Cloudflare (checked against the
    # original peer address — see the geo block above).
    if ($festify_from_cloudflare = 0) {
        return 403;
    }

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Health check — no rate limiting, no access log ──────────────────────
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:8089;
    }

    # ── Debug log relay — localhost only ────────────────────────────────────
    location = /api/debug/log {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8089;
    }

    # ── Spotify auth — 5 req/min, burst 3 ──────────────────────────────────
    location ~ ^/api/spotify/(exchange-code|link-account|refresh-token|client-token)$ {
        limit_req zone=festify_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8089;
    }

    # ── Anonymous session — same tight limit as auth ─────────────────────
    location = /api/auth/anonymous {
        limit_req zone=festify_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8089;
    }

    # ── SSE event streams — no buffering, long timeout ──────────────────────
    location ~ ^/api/parties/[^/]+/events$ {
        proxy_pass            http://127.0.0.1:8089;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;
        proxy_set_header      Connection '';
        chunked_transfer_encoding on;
    }

    # ── General API — 60 req/min, burst 20 ─────────────────────────────────
    location /api/ {
        limit_req zone=festify_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8089/api/;
    }

    # ── WebSocket / realtime (legacy) ───────────────────────────────────────
    location /realtime {
        proxy_pass          http://127.0.0.1:8089/realtime;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    # ── Static frontend ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8088;
    }
}
