services:
  festify:
    build:
      context: .
    container_name: festify
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  festify-api:
    build:
      context: ./selfhost
    container_name: festify-api
    restart: unless-stopped
    environment:
      PORT: "8089"
      DATABASE_URL: postgres://festify:festify@festify-db:5432/festify
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://festify.kampvogn.dk}
      FESTIFY_ALLOWED_HOST_EMAILS: ${FESTIFY_ALLOWED_HOST_EMAILS:-thomas@kampvogn.dk,thomas@bydiana.dk}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_SECRET: ${TOKEN_ENCRYPTION_SECRET:-}
    depends_on:
      - festify-db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  festify-db:
    image: postgres:16-alpine
    container_name: festify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: festify
      POSTGRES_USER: festify
      POSTGRES_PASSWORD: festify
    volumes:
      - festify-db-data:/var/lib/postgresql/data
      - ./selfhost/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  festify-proxy:
    image: nginx:1.27-alpine
    container_name: festify-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - festify
      - festify-api
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

volumes:
  festify-db-data:
